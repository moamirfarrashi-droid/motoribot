name: DigiHinet AI Daily
on:
  schedule:
    - cron: '47 6 * * *'  # 10:17 Tehran
    - cron: '47 16 * * *' # 20:17 Tehran
    - cron: '47 8 * * *'  # Fresh news 12:17 Tehran
    - cron: '47 15 * * *' # Fresh news 19:17 Tehran
  workflow_dispatch:
    inputs:
      content:
        description: ready = prepared images / news = fresh Persian news
        type: choice
        default: ready
        options: [ready, news]
      mode:
        description: 'preview / test / publish'
        type: choice
        default: preview
        options: [preview, test, publish]
      day:
        description: 'Test: 1-20; publish: 0'
        type: string
        default: '0'
      slot:
        description: 'AI post 1 or 2'
        type: choice
        default: '1'
        options: ['1', '2']
permissions:
  contents: write
concurrency:
  group: digihinet-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Check AI content
        run: python -m unittest test_ai_daily test_news_fa -v
      - name: Git identity
        run: |
          git config user.name 'digihinet-bot'
          git config user.email 'digihinet-bot@users.noreply.github.com'
      - name: Publish reviewed AI post
        env:
          CONTENT: ${{ inputs.content }}
          ENABLE_AI_NEWS: ${{ vars.ENABLE_AI_NEWS }}
          RUN_MODE: ${{ inputs.mode || 'publish' }}
          DAY: ${{ inputs.day || '0' }}
          SLOT: ${{ inputs.slot || '0' }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          ENABLE_AI_POSTING: ${{ vars.ENABLE_AI_POSTING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_TEST_CHANNEL_ID: ${{ secrets.TELEGRAM_TEST_CHANNEL_ID }}
          PERSIST_STATE: 'true'
        run: |
          if [ "$CONTENT" = "news" ] || [ "$EVENT_SCHEDULE" = "47 8 * * *" ] || [ "$EVENT_SCHEDULE" = "47 15 * * *" ]; then
            python news_fa.py --mode "$RUN_MODE" --slot "$SLOT"
          else
            python ai_daily.py --mode "$RUN_MODE" --day "$DAY" --slot "$SLOT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-preview-${{ github.run_id }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore
