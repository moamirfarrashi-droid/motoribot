name: Divar to Telegram - Daily

on:
  schedule:
    # ساعت‌ها به وقت UTC هستن (ایران = UTC+3:30)
    # دقیقه‌ها عمداً غیر-رند (۱۲) گذاشته شدن تا با شلوغی دقیقه‌های رند
    # (مثل ۰۰ یا ۳۰) روی گیت‌هاب تداخل نکنن و اجرا از قلم نیفته.
    - cron: "12 6 * * *"    # ۰۹:۴۲ صبح ایران
    - cron: "12 7 * * *"    # ۱۰:۴۲ ایران
    - cron: "12 10 * * *"   # ۱۳:۴۲ ایران
    - cron: "12 13 * * *"   # ۱۶:۴۲ ایران
    - cron: "12 15 * * *"   # ۱۸:۴۲ ایران
  workflow_dispatch: {}   # اجرای دستی از تب Actions

permissions:
  contents: write   # برای کامیت کردن seen_posts.json

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SUPPORT_TELEGRAM_URL: ${{ secrets.SUPPORT_TELEGRAM_URL }}
          DIVAR_CITY_CODE: "1"
          DIVAR_CATEGORY: "motorcycles"
          POST_MODE: "album"
          MAX_IMAGES_PER_POST: "4"
          MAX_POSTS_PER_RUN: "4"
          DELAY_BETWEEN_POSTS_SECONDS: "45"
        run: python main.py
      - name: Save seen posts (prevent duplicates on next run)
        run: |
          git pull --rebase || true
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_posts.json || true
          git diff --cached --quiet || git commit -m "update seen posts [skip ci]"
          git push
